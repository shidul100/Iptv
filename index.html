<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My IPTV Web TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0b;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 15px;
    background: #151515;
    position: sticky;
    top: 0;
    z-index: 10;
}

h1 {
    margin: 0 0 12px;
    font-size: 22px;
}

#search {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 7px;
    font-size: 15px;
}

#categories {
    display: flex;
    overflow-x: auto;
    gap: 8px;
    padding: 10px 15px;
    background: #111;
}

.category {
    white-space: nowrap;
    padding: 8px 14px;
    background: #222;
    border-radius: 20px;
    cursor: pointer;
}

.category.active {
    background: #e50914;
}

#playerBox {
    background: black;
    padding: 10px;
}

video {
    width: 100%;
    max-height: 500px;
    background: black;
}

#nowPlaying {
    padding: 8px 5px;
    font-size: 16px;
}

#channels {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    padding: 15px;
}

.channel {
    background: #181818;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.2s;
}

.channel:hover {
    transform: scale(1.03);
}

.channel img {
    width: 100%;
    height: 100px;
    object-fit: contain;
    background: #222;
}

.channelName {
    padding: 9px;
    font-size: 14px;
    text-align: center;
}

.empty {
    padding: 30px;
    text-align: center;
    color: #aaa;
}
</style>
</head>

<body>

<header>
    <h1>📺 My Web TV</h1>
    <input id="search" type="text" placeholder="Search channel...">
</header>

<div id="categories"></div>

<div id="playerBox">
    <video id="player" controls playsinline></video>
    <div id="nowPlaying">Select a channel</div>
</div>

<div id="channels"></div>

<script>

const PLAYLIST_URL =
"https://raw.githubusercontent.com/shidul100/Iptv/refs/heads/main/playlist.m3u";

const player = document.getElementById("player");
const channelsDiv = document.getElementById("channels");
const categoriesDiv = document.getElementById("categories");
const searchInput = document.getElementById("search");
const nowPlaying = document.getElementById("nowPlaying");

let channels = [];
let currentCategory = "ALL";
let hls = null;


/* -------------------------
   LOAD PLAYLIST
-------------------------- */

fetch(PLAYLIST_URL)
.then(response => {

    if (!response.ok) {
        throw new Error("Playlist loading failed");
    }

    return response.text();
})
.then(text => {

    parsePlaylist(text);

    createCategories();

    showChannels();

})
.catch(error => {

    channelsDiv.innerHTML =
        '<div class="empty">❌ Playlist load failed</div>';

    console.error(error);
});


/* -------------------------
   PARSE M3U
-------------------------- */

function parsePlaylist(text) {

    const lines = text
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(x => x !== "");

    for (let i = 0; i < lines.length; i++) {

        if (!lines[i].startsWith("#EXTINF")) {
            continue;
        }

        const info = lines[i];

        // Channel name
        const comma = info.lastIndexOf(",");

        let name = comma !== -1
            ? info.substring(comma + 1).trim()
            : "Unknown Channel";

        // Logo
        const logoMatch =
            info.match(/tvg-logo="([^"]*)"/i);

        const logo =
            logoMatch ? logoMatch[1] : "";

        // Category
        const groupMatch =
            info.match(/group-title="([^"]*)"/i);

        const group =
            groupMatch ? groupMatch[1] : "OTHER";

        // Find next actual URL
        let url = "";

        for (let j = i + 1; j < lines.length; j++) {

            if (
                lines[j].startsWith("http://") ||
                lines[j].startsWith("https://")
            ) {
                url = lines[j];
                i = j;
                break;
            }

            if (lines[j].startsWith("#EXTINF")) {
                break;
            }
        }

        if (!url) continue;

        channels.push({
            name: name,
            logo: logo,
            group: group || "OTHER",
            url: url
        });
    }
}


/* -------------------------
   CREATE CATEGORIES
-------------------------- */

function createCategories() {

    const groups = [
        ...new Set(
            channels.map(channel => channel.group)
        )
    ];

    categoriesDiv.innerHTML = "";

    addCategory("ALL");

    groups.forEach(group => {
        addCategory(group);
    });
}


function addCategory(name) {

    const button = document.createElement("div");

    button.className = "category";

    if (name === "ALL") {
        button.classList.add("active");
    }

    button.textContent = name;

    button.onclick = () => {

        currentCategory = name;

        document
            .querySelectorAll(".category")
            .forEach(x => x.classList.remove("active"));

        button.classList.add("active");

        showChannels();
    };

    categoriesDiv.appendChild(button);
}


/* -------------------------
   SHOW CHANNELS
-------------------------- */

function showChannels() {

    const search =
        searchInput.value.toLowerCase().trim();

    channelsDiv.innerHTML = "";

    let filtered = channels.filter(channel => {

        const categoryMatch =
            currentCategory === "ALL" ||
            channel.group === currentCategory;

        const searchMatch =
            channel.name.toLowerCase().includes(search);

        return categoryMatch && searchMatch;
    });

    if (filtered.length === 0) {

        channelsDiv.innerHTML =
            '<div class="empty">No channel found</div>';

        return;
    }

    filtered.forEach(channel => {

        const card =
            document.createElement("div");

        card.className = "channel";

        card.innerHTML = `

            <img
                src="${channel.logo}"
                loading="lazy"
                onerror="this.style.display='none'"
            >

            <div class="channelName">
                ${channel.name}
            </div>
        `;

        card.onclick = () => {

            playChannel(
                channel.url,
                channel.name
            );

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        };

        channelsDiv.appendChild(card);
    });
}


/* -------------------------
   PLAY CHANNEL
-------------------------- */

function playChannel(url, name) {

    nowPlaying.textContent =
        "▶️ " + name;

    if (hls) {

        hls.destroy();

        hls = null;
    }

    /*
       HLS / M3U8
    */

    if (
        url.includes(".m3u8") ||
        url.includes("m3u8?")
    ) {

        if (Hls.isSupported()) {

            hls = new Hls({
                enableWorker: true
            });

            hls.loadSource(url);

            hls.attachMedia(player);

            hls.on(
                Hls.Events.MANIFEST_PARSED,
                function () {

                    player.play().catch(() => {});
                }
            );

            hls.on(
                Hls.Events.ERROR,
                function (event, data) {

                    console.log(
                        "HLS Error:",
                        data
                    );
                }
            );

        } else {

            player.src = url;

            player.play().catch(() => {});
        }

    } else {

        /*
           TS / other direct stream
        */

        player.src = url;

        player.play().catch(() => {});
    }
}


/* -------------------------
   SEARCH
-------------------------- */

searchInput.addEventListener(
    "input",
    showChannels
);

</script>

</body>
</html>
