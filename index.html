<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My IPTV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0b;
    color: white;
    font-family: Arial, sans-serif;
}

/* HEADER */
header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #111;
    padding: 12px;
    border-bottom: 1px solid #292929;
}

.header-title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 10px;
}

#search {
    width: 100%;
    padding: 11px 14px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #1b1b1b;
    color: white;
    outline: none;
    font-size: 15px;
}

/* CATEGORY */
.categories {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding: 10px 0 2px;
    scrollbar-width: none;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category-btn {
    flex: 0 0 auto;
    border: 0;
    border-radius: 20px;
    padding: 8px 13px;
    background: #252525;
    color: white;
    cursor: pointer;
}

.category-btn.active {
    background: #e50914;
}

/* PLAYER */
.player-container {
    position: sticky;
    top: 109px;
    z-index: 90;
    background: #000;
    width: 100%;
}

video {
    display: block;
    width: 100%;
    height: auto;
    max-height: 55vh;
    background: black;
}

.now-playing {
    padding: 8px 12px;
    background: #111;
    font-size: 14px;
}

/* CHANNEL GRID */
#channelGrid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 10px;
    padding: 12px;
}

.channel {
    min-width: 0;
    background: #151515;
    border-radius: 9px;
    padding: 7px;
    cursor: pointer;
    border: 1px solid #262626;
    transition: transform .15s, border-color .15s;
}

.channel:hover {
    transform: translateY(-2px);
    border-color: #e50914;
}

.channel-logo {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    background: #0d0d0d;
    border-radius: 6px;
    display: block;
}

.channel-name {
    font-size: 12px;
    text-align: center;
    margin-top: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.channel-group {
    color: #999;
    font-size: 10px;
    text-align: center;
    margin-top: 3px;
}

/* LOADING */
#loading {
    text-align: center;
    padding: 30px;
    color: #aaa;
}

#error {
    display: none;
    text-align: center;
    padding: 25px;
    color: #ff6b6b;
}

/* MOBILE
   Exactly 5 channels per row
*/
@media (max-width: 600px) {

    #channelGrid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 5px;
        padding: 6px;
    }

    .channel {
        padding: 4px;
        border-radius: 6px;
    }

    .channel-name {
        font-size: 9px;
        margin-top: 3px;
    }

    .channel-group {
        display: none;
    }

    .header-title {
        font-size: 18px;
    }

    .player-container {
        top: 104px;
    }

    video {
        max-height: 42vh;
    }
}

/* VERY SMALL MOBILE */
@media (max-width: 360px) {

    #channelGrid {
        gap: 4px;
        padding: 5px;
    }

    .channel-name {
        font-size: 8px;
    }
}
</style>
</head>

<body>

<header>

    <div class="header-title">
        📺 My IPTV
    </div>

    <input
        type="search"
        id="search"
        placeholder="Search channel..."
    >

    <div class="categories" id="categories">
        <button class="category-btn active" data-category="ALL">
            All
        </button>
    </div>

</header>


<!-- VIDEO PLAYER -->

<div class="player-container">

    <video
        id="videoPlayer"
        controls
        playsinline
        preload="metadata"
    ></video>

    <div class="now-playing" id="nowPlaying">
        Select a channel
    </div>

</div>


<div id="loading">
    Loading channels...
</div>

<div id="error">
    Unable to load playlist.
</div>


<div id="channelGrid"></div>


<script>

/* =========================================================
   YOUR PLAYLIST
   ========================================================= */

const PLAYLIST_URL =
"https://raw.githubusercontent.com/shidul100/Iptv/refs/heads/main/playlist.m3u";


/* =========================================================
   VARIABLES
   ========================================================= */

const video = document.getElementById("videoPlayer");
const grid = document.getElementById("channelGrid");
const search = document.getElementById("search");
const loading = document.getElementById("loading");
const errorBox = document.getElementById("error");
const nowPlaying = document.getElementById("nowPlaying");
const categoriesBox = document.getElementById("categories");

let channels = [];
let currentCategory = "ALL";
let hls = null;


/* =========================================================
   LOAD M3U
   ========================================================= */

async function loadPlaylist() {

    try {

        loading.style.display = "block";
        errorBox.style.display = "none";

        const response = await fetch(
            PLAYLIST_URL + "?t=" + Date.now()
        );

        if (!response.ok) {
            throw new Error("Playlist HTTP error");
        }

        const text = await response.text();

        channels = parseM3U(text);

        loading.style.display = "none";

        if (!channels.length) {
            errorBox.innerText =
                "No channels found in playlist.";
            errorBox.style.display = "block";
            return;
        }

        createCategories();
        renderChannels();

    } catch (err) {

        console.error(err);

        loading.style.display = "none";

        errorBox.innerText =
            "Playlist load failed.";
        errorBox.style.display = "block";
    }
}


/* =========================================================
   M3U PARSER
   ========================================================= */

function parseM3U(text) {

    const lines = text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean);

    const result = [];

    for (let i = 0; i < lines.length; i++) {

        if (!lines[i].startsWith("#EXTINF")) {
            continue;
        }

        const info = lines[i];

        let url = "";

        for (let j = i + 1; j < lines.length; j++) {

            if (!lines[j].startsWith("#")) {
                url = lines[j];
                break;
            }
        }

        if (!url) continue;


        /* CHANNEL NAME */

        let name = info.substring(
            info.lastIndexOf(",") + 1
        ).trim();

        if (!name) {
            name = "Unknown Channel";
        }


        /* LOGO */

        const logoMatch =
            info.match(/tvg-logo="([^"]*)"/i);

        const logo =
            logoMatch ? logoMatch[1] : "";


        /* GROUP */

        const groupMatch =
            info.match(/group-title="([^"]*)"/i);

        const group =
            groupMatch && groupMatch[1]
                ? groupMatch[1]
                : "OTHER";


        /* ID */

        const idMatch =
            info.match(/tvg-id="([^"]*)"/i);

        const id =
            idMatch ? idMatch[1] : "";


        result.push({
            name,
            logo,
            group,
            id,
            url
        });
    }

    return result;
}


/* =========================================================
   CATEGORIES
   ========================================================= */

function createCategories() {

    const groups = [
        ...new Set(
            channels.map(c => c.group || "OTHER")
        )
    ];

    categoriesBox.innerHTML = "";

    addCategoryButton("ALL");

    groups.forEach(group => {
        addCategoryButton(group);
    });
}


function addCategoryButton(category) {

    const button =
        document.createElement("button");

    button.className =
        "category-btn" +
        (category === "ALL" ? " active" : "");

    button.textContent = category;

    button.onclick = () => {

        currentCategory = category;

        document
            .querySelectorAll(".category-btn")
            .forEach(btn => {
                btn.classList.remove("active");
            });

        button.classList.add("active");

        renderChannels();
    };

    categoriesBox.appendChild(button);
}


/* =========================================================
   RENDER CHANNELS
   ========================================================= */

function renderChannels() {

    const keyword =
        search.value.toLowerCase().trim();

    grid.innerHTML = "";

    const filtered =
        channels.filter(channel => {

            const categoryOK =
                currentCategory === "ALL" ||
                channel.group === currentCategory;

            const searchOK =
                channel.name
                    .toLowerCase()
                    .includes(keyword);

            return categoryOK && searchOK;
        });


    filtered.forEach(channel => {

        const card =
            document.createElement("div");

        card.className = "channel";


        const img =
            document.createElement("img");

        img.className = "channel-logo";

        img.loading = "lazy";

        img.alt = channel.name;

        img.src =
            channel.logo ||
            "https://via.placeholder.com/300?text=TV";


        /* Broken logo fallback */

        img.onerror = function() {

            this.onerror = null;

            this.src =
                "https://via.placeholder.com/300?text=TV";
        };


        const name =
            document.createElement("div");

        name.className = "channel-name";

        name.textContent = channel.name;


        const group =
            document.createElement("div");

        group.className = "channel-group";

        group.textContent = channel.group;


        card.appendChild(img);
        card.appendChild(name);
        card.appendChild(group);


        card.onclick = () => {

            playChannel(channel);

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        };


        grid.appendChild(card);
    });
}


/* =========================================================
   PLAY CHANNEL
   ========================================================= */

function playChannel(channel) {

    nowPlaying.innerHTML =
        "▶ " + escapeHTML(channel.name);


    /* Destroy previous HLS */

    if (hls) {

        try {
            hls.destroy();
        } catch(e) {}

        hls = null;
    }


    video.pause();

    video.removeAttribute("src");

    video.load();


    const url = channel.url;

    console.log(
        "Playing:",
        channel.name,
        url
    );


    /* ===============================================
       HLS.JS
       =============================================== */

    if (
        url.toLowerCase().includes(".m3u8") &&
        Hls.isSupported()
    ) {

        hls = new Hls({

            enableWorker: true,

            lowLatencyMode: true,

            backBufferLength: 30,

            maxBufferLength: 30,

            maxMaxBufferLength: 60,

            startLevel: -1,

            capLevelToPlayerSize: true
        });


        hls.loadSource(url);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function() {

                video.play()
                    .catch(() => {});
            }
        );


        hls.on(
            Hls.Events.ERROR,
            function(event, data) {

                console.warn(
                    "HLS error:",
                    data
                );


                /* Recover media error */

                if (
                    data.fatal &&
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                ) {

                    hls.recoverMediaError();

                    return;
                }


                /* Reload network error */

                if (
                    data.fatal &&
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ) {

                    setTimeout(() => {

                        if (hls) {
                            hls.startLoad();
                        }

                    }, 1000);

                    return;
                }


                if (data.fatal) {

                    showPlayerError(
                        "This stream cannot be played in the browser."
                    );
                }
            }
        );


        return;
    }


    /* ===============================================
       NATIVE HLS
       =============================================== */

    if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src = url;

        video.addEventListener(
            "loadedmetadata",
            function nativePlay() {

                video.removeEventListener(
                    "loadedmetadata",
                    nativePlay
                );

                video.play()
                    .catch(() => {});
            }
        );

        return;
    }


    /* ===============================================
       NORMAL VIDEO / TS
       =============================================== */

    video.src = url;

    video.load();

    video.play()
        .catch(() => {

            showPlayerError(
                "This format is not supported by your browser."
            );
        });
}


/* =========================================================
   PLAYER ERROR
   ========================================================= */

function showPlayerError(message) {

    nowPlaying.innerHTML =
        "⚠️ " + escapeHTML(message);
}


/* =========================================================
   SEARCH
   ========================================================= */

search.addEventListener(
    "input",
    renderChannels
);


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   VIDEO EVENTS
   ========================================================= */

video.addEventListener(
    "waiting",
    () => {
        nowPlaying.innerHTML =
            "⏳ Buffering...";
    }
);


video.addEventListener(
    "playing",
    () => {

        /* Keep selected channel name */

        if (
            nowPlaying.innerHTML.includes("Buffering")
        ) {
            nowPlaying.innerHTML =
                "▶ Playing";
        }
    }
);


video.addEventListener(
    "error",
    () => {

        console.warn(
            "Native video error:",
            video.error
        );

        showPlayerError(
            "Stream unavailable or unsupported."
        );
    }
);


/* =========================================================
   START
   ========================================================= */

loadPlaylist();

</script>

</body>
</html>
